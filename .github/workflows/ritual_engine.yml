name: Run Ritual Engine

on:
  workflow_dispatch: # Vercel API에서 수동/API 호출 트리거
    inputs:
      caller:
        description: 'Who triggered this run?'
        required: false
        default: 'Vercel API'

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    
    # 동시 실행 방지: 한 번에 하나만 실행되도록 보장
    concurrency:
      group: ritual-engine
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # 패키지 다운로드 속도 최적화
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Ritual Engine Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python api/ritual_engine.py
