<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WYSH Ritual Editor</title>
    <style>
        :root {
            --wysh-black: #1a1a1a;
            --wysh-white: #ffffff;
            --wysh-gray: #f5f5f5;
            --wysh-accent: #2e2e2e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--wysh-black);
            color: var(--wysh-white);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -2px;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1rem;
            color: #888;
            margin-bottom: 3rem;
            line-height: 1.5;
        }

        .btn {
            background-color: var(--wysh-white);
            color: var(--wysh-black);
            border: none;
            padding: 1.2rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 14px 0 rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
            background-color: #f0f0f0;
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            background-color: #444;
            color: #888;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Loading Spinner */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: var(--wysh-white);
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        .btn.loading .btn-text {
            display: none;
        }

        .btn.loading .spinner {
            display: block;
            border-top-color: var(--wysh-black);
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #status-message {
            margin-top: 2rem;
            font-size: 0.95rem;
            color: #aaa;
            min-height: 24px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #status-message.visible {
            opacity: 1;
        }

        .success {
            color: #4CAF50 !important;
        }

        .error {
            color: #F44336 !important;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="logo">WYSH.</div>
        <div class="subtitle">AI Ritual Editor Dashboard<br><span style="font-size: 0.8rem;">글로벌 푸드/영양 트렌드 및 핫한 브랜드 스크래핑
                & 아티클 자동 생성</span></div>

        <button id="run-btn" class="btn">
            <span class="btn-text">AI 에디터 가동하기 🚀</span>
            <div class="spinner"></div>
        </button>

        <div id="status-message">대기 중...</div>
    </div>

    <script>
        const btn = document.getElementById('run-btn');
        const statusMsg = document.getElementById('status-message');
        const btnText = document.querySelector('.btn-text');

        // 로딩 시 표출될 메시지 배열
        const loadingMessages = [
            "GitHub 클라우드 로봇에게 핑(Ping) 전송 중...",
            "AI 에디터 작업 지시서 전달 중..."
        ];

        let messageInterval;

        btn.addEventListener('click', () => {
            // 버튼 상태 변경
            btn.classList.add('loading');
            btn.disabled = true;
            statusMsg.className = 'visible';

            // 상태 메시지 로테이션 애니메이션 (페이드 효과 추가)
            let msgIndex = 0;
            statusMsg.textContent = loadingMessages[0];

            messageInterval = setInterval(() => {
                // 1. 먼저 글자를 서서히 숨김 (페이드아웃)
                statusMsg.style.opacity = 0;

                setTimeout(() => {
                    // 2. 0.5초 뒤 글자가 완전히 안 보일 때 내용 투입
                    msgIndex = (msgIndex + 1) % loadingMessages.length;
                    statusMsg.textContent = loadingMessages[msgIndex];

                    // 3. 다시 글자를 서서히 나타나게 함 (페이드인)
                    statusMsg.style.opacity = 1;
                }, 500); // CSS 트랜지션 시간(0.5s)과 동일하게 맞춤
            }, 6000); // 6초마다 메시지 변경 이벤트 발생

            // 메인 UI 스레드가 인터벌 타이머를 먼저 실행하고 인지할 수 있도록 딜레이
            setTimeout(async () => {
                try {
                    // Vercel Serverless Function 호출
                    const response = await fetch('/api/run', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    clearInterval(messageInterval);

                    const result = await response.json();

                    statusMsg.style.opacity = 0; // 메시지 업데이트 브리징을 위한 초기화 투명도
                    setTimeout(() => {
                        if (result.status === 'success') {
                            statusMsg.innerHTML = `✅ <b>전송 완료!</b><br>로봇 에디터가 클라우드에서 기사 작성을 시작했습니다.<br>약 3분 뒤 노션에서 확인해주세요!`;
                            statusMsg.className = 'visible success';
                        } else {
                            statusMsg.innerHTML = `❌ <b>오류 발생:</b> ${result.message}`;
                            statusMsg.className = 'visible error';
                        }
                        statusMsg.style.opacity = 1; // 결과 노출
                    }, 500);
                } catch (error) {
                    clearInterval(messageInterval);
                    statusMsg.style.opacity = 0;
                    setTimeout(() => {
                        statusMsg.innerHTML = `❌ <b>네트워크 오류:</b> 서버와 통신할 수 없습니다.`;
                        statusMsg.className = 'visible error';
                        statusMsg.style.opacity = 1;
                    }, 500);
                    console.error(error);
                } finally {
                    // 버튼 상태 복구
                    btn.classList.remove('loading');
                    btn.disabled = false;
                    btnText.textContent = "AI 에디터 다시 실행하기 🔄";
                }
            }, 100);
        });
    </script>
</body>

</html>
